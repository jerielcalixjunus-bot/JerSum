    <form id="daftar" action="SUMATIF3.html">

        <label>Nama Lengkap *</label>

        <input type="text"id="user" placeholder="Contoh: jer.calix" required>

        <input type="email" placeholder="email@contoh.com" required>

        <label>Password *</label>
        <input type="password" id="pass" placeholder="1234568_bim" required>
      
        <label>Konfirmasi Password *</label>
        <input type="password" id="confirm" placeholder="12345678_bim" required>
      
        <label>No. Telepon *</label>

      </div>
	  <button type="submit">Daftar Sekarang</button>
    </form>
